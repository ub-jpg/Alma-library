<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alma Library</title>
<style>
:root{--bg:#f6f1e8;--paper:#fbf8f1;--ink:#24211d;--muted:#7b746b;--line:#ddd5c9;--chip:#ebe3d7}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:54px 22px 90px} .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9a9186}
h1{font:400 clamp(42px,7vw,68px)/1 Georgia,serif;margin:10px 0 14px} .intro{max-width:720px;color:var(--muted);font-size:17px;line-height:1.55}
.controls{position:sticky;top:0;background:linear-gradient(var(--bg) 88%,transparent);padding:24px 0 22px;z-index:3}
input{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:var(--paper);font-size:16px;color:var(--ink)}
.filters{display:flex;gap:7px;overflow:auto;padding:12px 0 2px;scrollbar-width:none} .filters::-webkit-scrollbar{display:none}
button{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;color:#625c54} button.on{background:#292620;color:white;border-color:#292620}
.count{font-size:12px;color:#9a9186;margin-top:10px}
.book{display:grid;grid-template-columns:40px 1fr 1.2fr;gap:22px;padding:28px 0;border-top:1px solid var(--line)}
.num{font:14px Georgia,serif;color:#aaa197;padding-top:4px} h2{font:400 24px/1.15 Georgia,serif;margin:0 0 6px} .author{font-size:14px;color:#898177;margin-bottom:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chip{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:#71695f}
.desc{font-size:15px;line-height:1.62;color:#5e574f} .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.pace,.status{font-size:10px;letter-spacing:.06em;border-radius:999px;padding:6px 9px} .pace{background:#e8ded0} .status{background:#292620;color:white}
.empty{padding:50px 0;color:var(--muted)}
@media(max-width:700px){.wrap{padding:38px 20px 70px}.controls{position:static}.book{grid-template-columns:28px 1fr;gap:12px}.desc{grid-column:2}h2{font-size:22px}}
</style></head><body><div class="wrap">
<div class="eyebrow">Personal reading archive</div><h1>Alma Library</h1>
<div class="intro">Книги, которые меняют угол зрения: сознание, восприятие, Я, миф, символ, время, язык и творчество.</div>
<div class="controls"><input id="q" placeholder="Поиск по книгам, авторам и идеям…"><div class="filters" id="filters"></div><div class="count" id="count"></div></div>
<main id="list"></main></div>
<script>
const books=[{"title": "Душевные омуты", "author": "Джеймс Холлис", "topics": ["SELF", "DEATH & TIME"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Исследование тревоги, одиночества и тех внутренних состояний, которые заставляют нас встретиться с непрожитыми частями собственной психики."}, {"title": "Под тенью Сатурна", "author": "Джеймс Холлис", "topics": ["SELF", "MYTH & SYMBOL"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Юнгианский взгляд на мужскую психику, отцовскую фигуру, власть, рану и психологическое наследство, которое формирует взрослую жизнь."}, {"title": "Перевал в середине пути", "author": "Джеймс Холлис", "topics": ["SELF"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "О кризисе середины жизни как моменте, когда прежняя идентичность перестаёт работать и возникает необходимость заново выяснить, кто ты."}, {"title": "Человек и его символы", "author": "К. Г. Юнг и др.", "topics": ["MYTH & SYMBOL", "DREAMS & ALTERED STATES"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Доступный вход в мир Юнга: сны, символы, архетипы и способы, которыми бессознательное проявляет себя в человеческой жизни."}, {"title": "Тысячеликий герой", "author": "Джозеф Кэмпбелл", "topics": ["MYTH & SYMBOL"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Кэмпбелл ищет повторяющуюся структуру путешествия героя в мифах разных культур и показывает миф как карту психологического превращения."}, {"title": "Сила мифа", "author": "Джозеф Кэмпбелл, Билл Мойерс", "topics": ["MYTH & SYMBOL"], "pace": "OPEN & FLOWING", "status": "VERY CURIOUS", "description": "Живой разговор о том, зачем современному человеку миф и почему древние истории продолжают описывать фундаментальные человеческие переживания."}, {"title": "Мифы, в которых нам жить", "author": "Джозеф Кэмпбелл", "topics": ["MYTH & SYMBOL"], "pace": "FOCUSED", "status": "VERY CURIOUS", "description": "О том, как мифологические структуры продолжают действовать внутри современного сознания, даже когда мы перестаём воспринимать их буквально."}, {"title": "Одиссея", "author": "Гомер", "topics": ["MYTH & SYMBOL", "SELF"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Путешествие домой как история искушения, памяти, идентичности, потери и возвращения к себе. Лучше читать эпизодами, а не как обязательную классику."}, {"title": "Метаморфозы", "author": "Овидий", "topics": ["MYTH & SYMBOL"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Огромная сеть античных историй о превращении — тела, личности, желания, власти и судьбы. Источник образов, которые продолжают жить в культуре."}, {"title": "Активное сознание", "author": "Олег Бахтияров", "topics": ["CONSCIOUSNESS", "PERCEPTION"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Практический и теоретический взгляд на управление вниманием, состояниями сознания и собственной психической деятельностью."}, {"title": "Деконцентрация", "author": "Олег Бахтияров", "topics": ["CONSCIOUSNESS", "PERCEPTION"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Исследование деконцентрации внимания как особого режима восприятия и инструмента изменения привычной организации сознания."}, {"title": "The Varieties of Religious Experience", "author": "William James", "topics": ["CONSCIOUSNESS", "DREAMS & ALTERED STATES"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Классическое исследование мистических и религиозных переживаний как феноменов человеческого сознания — без необходимости заранее принимать их метафизические объяснения."}, {"title": "Dreams of Light", "author": "Andrew Holecek", "topics": ["DREAMS & ALTERED STATES", "CONSCIOUSNESS"], "pace": "FOCUSED", "status": "VERY CURIOUS", "description": "Осознанные сновидения как лаборатория сознания: практика переносится из сна в дневную жизнь и становится способом исследовать природу опыта."}, {"title": "Год жизни", "author": "Стивен Левин", "topics": ["DEATH & TIME", "SELF"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "Практика прожить год так, словно он последний: не мрачный эксперимент, а способ увидеть незавершённость, привязанности и реальные приоритеты."}, {"title": "Кто умирает?", "author": "Стивен Левин", "topics": ["DEATH & TIME", "SELF"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Исследование смерти как вопроса о природе самого Я: что именно мы боимся потерять и что обнаруживается, когда привычная идентичность становится ненадёжной."}, {"title": "Вглядываясь в солнце", "author": "Ирвин Ялом", "topics": ["DEATH & TIME", "SELF"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "Психотерапевтический взгляд на страх смерти и на то, как осознание конечности может менять способ, которым человек проживает собственную жизнь."}, {"title": "Improvisation, Creativity, and Consciousness", "author": "Ed Sarath", "topics": ["CREATIVITY", "CONSCIOUSNESS"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Импровизация рассматривается не только как музыкальная техника, но как особый способ познания, творчества и изменения сознания."}, {"title": "The Creative Act: A Way of Being", "author": "Rick Rubin", "topics": ["CREATIVITY", "PERCEPTION"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "Творчество не как производство результата, а как способ воспринимать мир, замечать сигналы и становиться доступнее для появления нового."}, {"title": "The Master and His Emissary", "author": "Iain McGilchrist", "topics": ["CONSCIOUSNESS", "PERCEPTION"], "pace": "DEEP DIVE", "status": "WANT TO READ", "description": "Большая теория о двух режимах внимания и восприятия, связанных с полушариями мозга, и о том, как эти режимы формируют нашу картину мира и культуру."}, {"title": "Психология и алхимия", "author": "К. Г. Юнг", "topics": ["MYTH & SYMBOL", "SELF"], "pace": "DEEP DIVE", "status": "WANT TO READ", "description": "Алхимические образы как язык бессознательного и процесса психологической трансформации. Плотный Юнг — книга для медленного исследования."}, {"title": "Происхождение и история сознания", "author": "Эрих Нойманн", "topics": ["CONSCIOUSNESS", "MYTH & SYMBOL"], "pace": "DEEP DIVE", "status": "VERY CURIOUS", "description": "Попытка описать развитие человеческого сознания через повторяющиеся мифологические структуры и постепенное отделение эго от бессознательного."}, {"title": "Великая Мать", "author": "Эрих Нойманн", "topics": ["MYTH & SYMBOL", "SELF"], "pace": "DEEP DIVE", "status": "VERY CURIOUS", "description": "Архетип Великой Матери прослеживается через мифологию, религию, искусство и символы разных культур — как целая карта коллективного воображения."}, {"title": "Алхимия: введение в символизм и психологию", "author": "Мари-Луиза фон Франц", "topics": ["MYTH & SYMBOL", "SELF"], "pace": "SLOW READING", "status": "VERY CURIOUS", "description": "Более доступный вход в психологическое прочтение алхимии: странные древние образы становятся языком внутренних процессов и трансформации."}, {"title": "The Dream and the Underworld", "author": "James Hillman", "topics": ["DREAMS & ALTERED STATES", "MYTH & SYMBOL", "SELF"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Хиллман предлагает не переводить сон на язык дневной жизни. Сон — самостоятельный подземный мир психики со своей логикой, образами и отношением к смерти."}, {"title": "The Soul's Code", "author": "James Hillman", "topics": ["SELF", "MYTH & SYMBOL"], "pace": "FOCUSED", "status": "VERY CURIOUS", "description": "Идея daimon: будто человеческая жизнь несёт собственную внутреннюю форму и направление, которые нельзя полностью объяснить воспитанием или обстоятельствами."}, {"title": "The Denial of Death", "author": "Ernest Becker", "topics": ["DEATH & TIME", "SELF"], "pace": "SLOW READING", "status": "VERY CURIOUS", "description": "Радикальная идея: значительная часть культуры, амбиций и человеческого поведения может быть способом справляться с осознанием собственной смертности."}, {"title": "Священное и мирское", "author": "Мирча Элиаде", "topics": ["MYTH & SYMBOL", "PERCEPTION"], "pace": "FOCUSED", "status": "VERY CURIOUS", "description": "Как меняются пространство, время, дом, природа и само существование, когда мир переживается не как нейтральный, а как наполненный сакральным смыслом."}, {"title": "Миф о вечном возвращении", "author": "Мирча Элиаде", "topics": ["MYTH & SYMBOL", "DEATH & TIME"], "pace": "SLOW READING", "status": "VERY CURIOUS", "description": "Почему традиционное сознание понимает время через повторение первичных, архетипических событий — и насколько это отличается от современной линейной истории."}, {"title": "The Ritual Process", "author": "Victor Turner", "topics": ["MYTH & SYMBOL", "SELF"], "pace": "SLOW READING", "status": "VERY CURIOUS", "description": "Классическое исследование лиминальности: состояния между идентичностями, когда старый порядок уже разрушен, а новый ещё не возник."}, {"title": "Steps to an Ecology of Mind", "author": "Gregory Bateson", "topics": ["CONSCIOUSNESS", "LANGUAGE & MEANING"], "pace": "DEEP DIVE", "status": "VERY CURIOUS", "description": "Разум рассматривается не как вещь внутри головы, а как сеть отношений, различий и обратных связей. Антропология встречается с кибернетикой и теорией систем."}, {"title": "The Embodied Mind", "author": "Francisco Varela, Evan Thompson, Eleanor Rosch", "topics": ["CONSCIOUSNESS", "PERCEPTION"], "pace": "DEEP DIVE", "status": "WANT TO READ", "description": "Сознание возникает не из мозга в изоляции, а из взаимодействия мозга, тела и мира. Когнитивная наука встречается с феноменологией и буддийской мыслью."}, {"title": "The Holotropic Mind", "author": "Stanislav Grof", "topics": ["DREAMS & ALTERED STATES", "CONSCIOUSNESS"], "pace": "FOCUSED", "status": "VERY CURIOUS", "description": "Спорная, но богатая модель необычных состояний сознания, трансперсональных переживаний и психологических сюжетов смерти и возрождения."}, {"title": "The Origin of Consciousness in the Breakdown of the Bicameral Mind", "author": "Julian Jaynes", "topics": ["CONSCIOUSNESS", "LANGUAGE & MEANING", "MYTH & SYMBOL"], "pace": "DEEP DIVE", "status": "WANT TO READ", "description": "Радикальная гипотеза: современное субъективное сознание могло возникнуть сравнительно недавно, а внутреннюю речь древние люди могли переживать как внешние голоса — в том числе голоса богов."}, {"title": "The Ego Tunnel", "author": "Thomas Metzinger", "topics": ["SELF", "CONSCIOUSNESS"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Что, если Я — не сущность, а прозрачная модель, создаваемая мозгом? Мы не замечаем модель как модель и поэтому переживаем её как непосредственное присутствие себя."}, {"title": "I Am a Strange Loop", "author": "Douglas Hofstadter", "topics": ["SELF", "CONSCIOUSNESS"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Сознание и Я как самореферентная петля: система становится достаточно сложной, чтобы создать внутри себя символическую модель самой себя."}, {"title": "The Case Against Reality", "author": "Donald Hoffman", "topics": ["PERCEPTION", "CONSCIOUSNESS"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Эволюция могла оптимизировать восприятие не для истины, а для выживания. То, что мы видим как реальность, может быть удобным интерфейсом, а не её буквальным изображением."}, {"title": "Other Minds", "author": "Peter Godfrey-Smith", "topics": ["CONSCIOUSNESS", "PERCEPTION"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "Осьминог как естественный эксперимент с другой архитектурой разума: что можно узнать о сознании, когда интеллект эволюционирует совершенно иным путём."}, {"title": "What Is It Like to Be a Bat?", "author": "Thomas Nagel", "topics": ["CONSCIOUSNESS", "PERCEPTION"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "Короткое философское эссе о субъективности: даже полное объективное знание о мозге может не сообщить нам, каково быть существом, переживающим мир иначе."}, {"title": "The Man Who Mistook His Wife for a Hat", "author": "Oliver Sacks", "topics": ["PERCEPTION", "SELF"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "Неврологические случаи показывают, сколько элементов привычной реальности незаметно конструирует мозг — от узнавания лиц до ощущения собственного тела."}, {"title": "Being No One", "author": "Thomas Metzinger", "topics": ["SELF", "CONSCIOUSNESS"], "pace": "DEEP DIVE", "status": "LATER", "description": "Большая философская аргументация против идеи устойчивого внутреннего Я. Если The Ego Tunnel захочется не просто принять как провокацию, а разобрать по винтикам."}, {"title": "The Experience Machine", "author": "Andy Clark", "topics": ["PERCEPTION", "CONSCIOUSNESS"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Мозг как машина предсказаний: восприятие — не пассивная запись мира, а непрерывная гипотеза, которую сенсорные данные постоянно корректируют."}, {"title": "Surfing Uncertainty", "author": "Andy Clark", "topics": ["PERCEPTION", "CONSCIOUSNESS"], "pace": "DEEP DIVE", "status": "LATER", "description": "Глубокое погружение в predictive processing: как предсказание, тело и действие могут составлять единую архитектуру восприятия и мышления."}, {"title": "The Order of Time", "author": "Carlo Rovelli", "topics": ["DEATH & TIME", "PERCEPTION"], "pace": "OPEN & FLOWING", "status": "WANT TO READ", "description": "Физика разрушает интуитивное представление об универсальном настоящем и ровно текущем времени. Короткая и поэтичная книга о гораздо более странной временной реальности."}, {"title": "From Bacteria to Bach and Back", "author": "Daniel Dennett", "topics": ["CONSCIOUSNESS", "LANGUAGE & MEANING"], "pace": "SLOW READING", "status": "VERY CURIOUS", "description": "Как слепые эволюционные процессы способны породить разум, культуру, значение и творчество — без центрального проектировщика."}, {"title": "Gödel, Escher, Bach", "author": "Douglas Hofstadter", "topics": ["CONSCIOUSNESS", "LANGUAGE & MEANING", "CREATIVITY"], "pace": "DEEP DIVE", "status": "LATER", "description": "Математика, музыка, искусство, рекурсия и самореференция соединяются в огромную интеллектуальную игру о том, как из формальных систем может возникать смысл."}, {"title": "Metaphors We Live By", "author": "George Lakoff, Mark Johnson", "topics": ["LANGUAGE & MEANING", "PERCEPTION"], "pace": "FOCUSED", "status": "WANT TO READ", "description": "Метафора — не украшение речи, а часть архитектуры мышления. Мы понимаем время, отношения, спор и абстрактные идеи через телесные и пространственные модели."}, {"title": "The Spell of the Sensuous", "author": "David Abram", "topics": ["PERCEPTION", "LANGUAGE & MEANING"], "pace": "SLOW READING", "status": "VERY CURIOUS", "description": "Феноменология, антропология и язык соединяются в вопросе о том, как письменность и культура изменили человеческое восприятие живого мира."}, {"title": "The Mind's I", "author": "Douglas Hofstadter, Daniel Dennett", "topics": ["SELF", "CONSCIOUSNESS"], "pace": "SLOW READING", "status": "WANT TO READ", "description": "Мысленные эксперименты и тексты о личности, душе, машинах и идентичности: что делает тебя тобой и может ли этот паттерн существовать в другой форме?"}];
const topicOrder=["ALL","CONSCIOUSNESS","SELF","PERCEPTION","MYTH & SYMBOL","DREAMS & ALTERED STATES","DEATH & TIME","LANGUAGE & MEANING","CREATIVITY"];
let active="ALL";
const list=document.querySelector("#list"), filters=document.querySelector("#filters"), q=document.querySelector("#q"), count=document.querySelector("#count");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderFilters(){filters.innerHTML=topicOrder.map(x=>`<button class="${x===active?"on":""}" data-x="${esc(x)}">${x}</button>`).join("");filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.x;renderFilters();render()})}
function render(){const query=q.value.trim().toLowerCase();const shown=books.filter(b=>(active==="ALL"||b.topics.includes(active))&&(!query||[b.title,b.author,b.description,...b.topics,b.pace,b.status].join(" ").toLowerCase().includes(query)));count.textContent=`${shown.length} books`;list.innerHTML=shown.length?shown.map((b,i)=>`<article class="book"><div class="num">${String(i+1).padStart(2,"0")}</div><div><h2>${esc(b.title)}</h2><div class="author">${esc(b.author)}</div><div class="chips">${b.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div><div class="desc">${esc(b.description)}<div class="meta"><span class="pace">${esc(b.pace)}</span><span class="status">${esc(b.status)}</span></div></div></article>`).join(""):`<div class="empty">Ничего не найдено.</div>`}
q.addEventListener("input",render);renderFilters();render();
</script></body></html>
